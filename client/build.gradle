plugins {
    id 'fabric-loom' version '1.9.2'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    manifest {
        attributes(
            "Implementation-Title": "TurboCraft Client",
            "Implementation-Version": project.version
        )
    }
}


// Diagnostic: prints the real ParticleManager signatures from the mapped jar so a mixin target can
// be verified instead of guessed. Runs as part of `build`.
tasks.register("printParticleSigs") {
    dependsOn "compileJava"
    doLast {
        def jar = configurations.compileClasspath.files.find { it.name.contains("minecraft") }
        println "MINECRAFT JAR: ${jar}"
        def cl = new URLClassLoader([jar] as URL[], (ClassLoader) null)
        def cls = cl.loadClass("net.minecraft.client.particle.ParticleManager")
        cls.declaredMethods.findAll { it.name.toLowerCase().contains("particle") }.each { m ->
            println "SIG: ${m.name}(${m.parameterTypes.collect { it.simpleName }.join(',')}) -> ${m.returnType.simpleName}"
        }
    }
}

tasks.named("compileJava") {
    doLast {
        def jar = configurations.compileClasspath.files.find { it.name.contains("minecraft") }
        if (jar) {
            def cl = new URLClassLoader([jar] as URL[], (ClassLoader) null)
            def cls = cl.loadClass("net.minecraft.client.particle.ParticleManager")
            cls.declaredMethods.findAll { it.name.toLowerCase().contains("particle") }.each { m ->
                println "SIG: ${m.name}(${m.parameterTypes.collect { it.simpleName }.join(',')}) -> ${m.returnType.simpleName}"
            }
        }
    }
}
