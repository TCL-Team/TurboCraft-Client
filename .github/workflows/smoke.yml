name: Smoke test (headless Minecraft)

# Boots Minecraft 1.20.1 with the mod on a virtual display (Xvfb + Mesa llvmpipe).
# Ye asli phone test ka replacement nahi hai, par mixin/startup crash 30 second me pakad leta hai.
# Manual trigger: Actions -> Smoke test -> Run workflow.

on:
  workflow_dispatch:
  push:
    paths:
      - "client/src/main/java/**"
      - "client/src/main/resources/**.mixins.json"
      - ".github/workflows/smoke.yml"

jobs:
  smoke:
    name: Launch MC with mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Install virtual display + software GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa mesa-utils

      - name: Boot the game and screenshot the title screen
        working-directory: client
        run: |
          chmod +x gradlew
          sudo apt-get install -y -qq imagemagick x11-apps >/dev/null 2>&1 || true

          Xvfb :99 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
          sleep 2

          # launch in background so we can screenshot while the game is alive
          DISPLAY=:99 ./gradlew runClient --console=plain --no-daemon > /tmp/client.log 2>&1 &
          GAME_PID=$!

          # wait for the mod to report it loaded (max 8 min)
          for i in $(seq 1 96); do
            if grep -q "\[TurboCraft\] Client loaded" /tmp/client.log 2>/dev/null; then
              echo "mod loaded after ~$((i*5))s"
              break
            fi
            sleep 5
          done

          # give the title screen a few frames to render
          sleep 12
          DISPLAY=:99 import -window root /tmp/title.png 2>/dev/null || true

          # coarse colour grid so CI logs show what was actually drawn
          if [ -f /tmp/title.png ]; then
            convert /tmp/title.png -resize 16x8! -depth 8 txt:- 2>/dev/null \
              | grep -oE '#[0-9A-F]{6}' | paste -sd' ' \
              | fold -w 200 | while IFS= read -r row; do echo "GRID: $row"; done
            echo "::notice::SCREENSHOT CAPTURED $(stat -c%s /tmp/title.png) bytes"
            # annotations are the only GitHub channel readable from restricted networks,
            # so the screenshot is exported as base64 chunks (256 KB -> ~350 KB, 6 chunks)
            convert /tmp/title.png -resize 900x -quality 78 /tmp/title_web.jpg 2>/dev/null || true
            if [ -f /tmp/title_web.jpg ]; then
              base64 -w0 /tmp/title_web.jpg > /tmp/title.b64
              echo "::notice::JPEG_BYTES $(stat -c%s /tmp/title_web.jpg)"
              split -b 45000 -d /tmp/title.b64 /tmp/chunk_
              for f in /tmp/chunk_*; do
                echo "::notice::B64 $(basename "$f") $(cat "$f")"
              done
            fi"
          else
            echo "::warning::no screenshot captured"
          fi

          kill $GAME_PID 2>/dev/null || true
          sleep 2
          pkill -f "net.minecraft" 2>/dev/null || true

      - name: Evaluate result
        run: |
          echo "=== TurboCraft / mixin lines ==="
          grep -nE "TurboCraft|mixin|Mixin|Setting user|Backend library|OpenGL|LWJGL" /tmp/client.log | tail -40 || true

          LOADED=$(grep -c "\[TurboCraft\] Client loaded" /tmp/client.log || true)
          CRASH=$(grep -cE "MixinApplyError|Mixin apply failed|MixinTransformerError|Unexpected error|HaltException" /tmp/client.log || true)

          echo "::notice::TurboCraft loaded markers: ${LOADED}"
          echo "::notice::Crash markers: ${CRASH}"

          if [ "$LOADED" -ge 1 ] && [ "$CRASH" -eq 0 ]; then
            echo "::notice::SMOKE PASS — mod loaded, no mixin errors"
          else
            echo "::error::SMOKE FAIL — see log tail below"
            tail -60 /tmp/client.log | while IFS= read -r line; do echo "  $line"; done
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-log
          path: |
            /tmp/client.log
            /tmp/title.png
          if-no-files-found: warn
          retention-days: 7
