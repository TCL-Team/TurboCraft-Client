name: Smoke test (headless Minecraft)

# Boots Minecraft 1.20.1 with the mod on a virtual display (Xvfb + Mesa llvmpipe).
# Ye asli phone test ka replacement nahi hai, par mixin/startup crash 30 second me pakad leta hai.
# Manual trigger: Actions -> Smoke test -> Run workflow.

on:
  workflow_dispatch:
  push:
    paths:
      - "client/src/main/java/**"
      - "client/src/main/resources/**.mixins.json"
      - ".github/workflows/smoke.yml"

jobs:
  smoke:
    name: Launch MC with mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Install virtual display + software GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa mesa-utils

      - name: Boot the game and screenshot the title screen
        working-directory: client
        run: |
          chmod +x gradlew
          sudo apt-get install -y -qq imagemagick x11-apps xdotool >/dev/null 2>&1 || true

          Xvfb :99 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
          sleep 2

          # skip the first-launch accessibility onboarding so the screenshot lands on the real title screen
          mkdir -p run
          if [ -f run/options.txt ]; then
            grep -q "^onboardAccessibility" run/options.txt \
              && sed -i 's/^onboardAccessibility:.*/onboardAccessibility:false/' run/options.txt \
              || echo "onboardAccessibility:false" >> run/options.txt
          else
            printf 'onboardAccessibility:false\nnarrator:0\n' > run/options.txt
          fi
          cat run/options.txt

          # launch in background so we can screenshot while the game is alive
          DISPLAY=:99 ./gradlew runClient --console=plain --no-daemon > /tmp/client.log 2>&1 &
          GAME_PID=$!

          # wait for the mod to report it loaded (max 8 min)
          for i in $(seq 1 96); do
            if grep -q "\[TurboCraft\] Client loaded" /tmp/client.log 2>/dev/null; then
              echo "mod loaded after ~$((i*5))s"
              break
            fi
            sleep 5
          done

          # give the title screen a few frames to render
          sleep 18
          DISPLAY=:99 import -window root /tmp/title.png 2>/dev/null || true

          # click the "TurboCraft Settings" button (5th row of the column) to capture the client menu.
          # Coordinates are for the smoke test's own logical resolution, so they are only a hint —
          # if the click misses we still keep the title screenshot.
          if command -v xdotool >/dev/null; then
            # Coordinate clicks are unreliable (window offset + Gui scale), so navigate with the
            # keyboard instead: Tab walks the button column in creation order, Enter activates.
            eval "$(DISPLAY=:99 xdotool search --name 'Minecraft' getwindowgeometry --shell 2>/dev/null | head -4)"
            DISPLAY=:99 xdotool windowactivate --sync "$WINDOW" 2>/dev/null || true
            sleep 1
            # 3 x Tab -> "TurboCraft Settings" (1: singleplayer, 2: multiplayer, 3: settings)
            DISPLAY=:99 xdotool key --window "$WINDOW" Tab 2>/dev/null || true
            sleep 1
            DISPLAY=:99 xdotool key --window "$WINDOW" Tab 2>/dev/null || true
            sleep 1
            DISPLAY=:99 xdotool key --window "$WINDOW" Tab 2>/dev/null || true
            sleep 1
            DISPLAY=:99 xdotool key --window "$WINDOW" Return 2>/dev/null || true
            sleep 5
            DISPLAY=:99 import -window root /tmp/menu.png 2>/dev/null || true

            # inside the menu: tab to the COSMETICS rail entry and open it
            for i in 1 2 3 4 5 6; do
              DISPLAY=:99 xdotool key --window "$WINDOW" Tab 2>/dev/null || true
              sleep 0.4
            done
            DISPLAY=:99 xdotool key --window "$WINDOW" Return 2>/dev/null || true
            sleep 4
            DISPLAY=:99 import -window root /tmp/menu2.png 2>/dev/null || true
          fi
          fi

          # coarse colour grid so CI logs show what was actually drawn
          if [ -f /tmp/title.png ]; then
            convert /tmp/title.png -resize 16x8! -depth 8 txt:- 2>/dev/null \
              | grep -oE '#[0-9A-F]{6}' | paste -sd' ' \
              | fold -w 200 | while IFS= read -r row; do echo "GRID: $row"; done
            echo "::notice::SCREENSHOT CAPTURED $(stat -c%s /tmp/title.png) bytes"
            mkdir -p ci-artifacts
            convert /tmp/title.png -resize 1000x -quality 80 ci-artifacts/title-screen.jpg 2>/dev/null || \
              cp /tmp/title.png ci-artifacts/title-screen.png
            if [ -f /tmp/menu.png ]; then
              convert /tmp/menu.png -resize 1000x -quality 80 ci-artifacts/client-menu.jpg 2>/dev/null || true
            fi
            if [ -f /tmp/menu2.png ]; then
              convert /tmp/menu2.png -resize 1000x -quality 80 ci-artifacts/client-menu-cosmetics.jpg 2>/dev/null || true
            fi
            ls -la ci-artifacts/
          else
            echo "::warning::no screenshot captured"
          fi

          kill $GAME_PID 2>/dev/null || true
          sleep 2
          pkill -f "net.minecraft" 2>/dev/null || true

      - name: Commit screenshot to branch
        if: always()
        run: |
          ls -la client/ci-artifacts/ || exit 0
          git config user.name "TurboCraft CI"
          git config user.email "ci@turbocraft.local"
          git add client/ci-artifacts/ || exit 0
          git commit -m "ci: title screen screenshot [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }} || echo "push skipped"

      - name: Evaluate result
        run: |
          echo "=== TurboCraft / mixin lines ==="
          grep -nE "TurboCraft|mixin|Mixin|Setting user|Backend library|OpenGL|LWJGL" /tmp/client.log | tail -40 || true

          LOADED=$(grep -c "\[TurboCraft\] Client loaded" /tmp/client.log || true)
          CRASH=$(grep -cE "MixinApplyError|Mixin apply failed|MixinTransformerError|Unexpected error|HaltException" /tmp/client.log || true)

          echo "::notice::TurboCraft loaded markers: ${LOADED}"
          echo "::notice::Crash markers: ${CRASH}"

          if [ "$LOADED" -ge 1 ] && [ "$CRASH" -eq 0 ]; then
            echo "::notice::SMOKE PASS — mod loaded, no mixin errors"
          else
            echo "::error::SMOKE FAIL — see log tail below"
            tail -60 /tmp/client.log | while IFS= read -r line; do echo "  $line"; done
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-log
          path: |
            /tmp/client.log
            /tmp/title.png
          if-no-files-found: warn
          retention-days: 7
