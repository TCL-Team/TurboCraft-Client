name: Build TurboCraft Client

on:
  push:
    branches:
      - "arena/**"
      - main
    paths:
      - "client/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "client/**"
  workflow_dispatch:

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        working-directory: client
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log

      - name: Publish failure log to issue #1
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Build failed** — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```'
            grep -E "^(> Task|FAILURE|What went wrong|Execution failed|Caused by|\* What|error:|.*error:)" -A 3 /tmp/build.log | tail -120
            echo '--- last 40 lines ---'
            tail -40 /tmp/build.log
            echo '```'
          } > /tmp/comment.md
          gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/comment.md
          # Backup readable channel: annotations are visible via the check-runs API
          tail -c 4000 /tmp/build.log | sed 's/^/  /' > /tmp/annot.txt
          while IFS= read -r line; do
            echo "::error::${line}" || true
          done < /tmp/annot.txt

      - name: Verify jar contents (readable via check-run annotations)
        run: |
          JAR=$(ls client/build/libs/turbocraft-client-*.jar | grep -v sources | head -1)
          echo "::notice::JAR: $JAR ($(stat -c%s "$JAR") bytes)"
          for entry in fabric.mod.json turbocraft.mixins.json assets/turbocraft/icon.png assets/turbocraft/lang/en_us.json com/turbocraft/client/TurboCraftClient.class com/turbocraft/client/hud/HudRenderer.class com/turbocraft/client/gui/ClientMenuScreen.class com/turbocraft/client/mixin/MouseMixin.class; do
            if unzip -l "$JAR" | grep -q " $entry"; then
              echo "::notice::OK $entry"
            else
              echo "::error::MISSING $entry"
            fi
          done
          echo "::notice::fabric.mod.json version => $(unzip -p "$JAR" fabric.mod.json | grep -o '\"version\": *\"[^\"]*\"' | head -1)"
          echo "::notice::entries => $(unzip -Z1 "$JAR" | tr '\n' ' ')"

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbocraft-client-jar
          path: client/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Attach jar to a rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: TurboCraft Client (latest build)
          prerelease: true
          body: |
            Auto-built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Download `turbocraft-client-*.jar` (not `-sources.jar`) and drop it into
            your launcher's `mods/` folder.
          files: client/build/libs/turbocraft-client-*.jar
